version: '3.8'

services:
  intergram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intergram_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/demo.html || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
